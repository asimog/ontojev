name: OntoJev verification

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      live_suites:
        description: "Run the bounded opt-in live provider suites (needs provider secrets)"
        type: boolean
        default: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --locked --extra dev
      - run: uv run --no-sync python -m ruff check cancerjev apps tests
      - run: uv run --no-sync python -m mypy
      - run: uv run --no-sync python -m tests.repository_facts check
      - run: uv run --no-sync python -m pytest
        env:
          CANCERJEV_FIXTURE_STAGE_DELAY_MS: "0"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --locked --extra dev
      - name: Install browser acceptance tooling
        working-directory: tests/browser
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium
      - name: Start the API
        env:
          CANCERJEV_DATA_DIR: ${{ runner.temp }}/cancerjev-data
          CANCERJEV_WEB_ORIGIN: http://127.0.0.1:3000
          CANCERJEV_FIXTURE_STAGE_DELAY_MS: "0"
        run: |
          uv run --no-sync python -m uvicorn apps.api.main:create_app --factory --host 127.0.0.1 --port 8000 > "$RUNNER_TEMP/api.log" 2>&1 &
      - name: Build and start the production web server
        env:
          NEXT_PUBLIC_CANCERJEV_API_URL: http://127.0.0.1:8000
        run: |
          cd apps/web
          npm ci
          npm run build
          npm run start > "$RUNNER_TEMP/web.log" 2>&1 &
      - name: Wait for API and web readiness
        run: |
          for attempt in {1..120}; do
            if curl -fsS http://127.0.0.1:8000/health >/dev/null && curl -fsS http://127.0.0.1:3000/runs >/dev/null; then
              echo "both servers ready"
              exit 0
            fi
            sleep 2
          done
          echo "servers not ready"
          tail -n 60 "$RUNNER_TEMP/api.log"
          tail -n 60 "$RUNNER_TEMP/web.log"
          exit 1
      - name: Run browser acceptance against the production-built web server
        working-directory: tests/browser
        env:
          CANCERJEV_DATA_DIR: ${{ runner.temp }}/cancerjev-data
          CANCERJEV_WEB_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_CANCERJEV_API_URL: http://127.0.0.1:8000
          CANCERJEV_FIXTURE_STAGE_DELAY_MS: "0"
        run: |
          # The spec spawns `python -m cancerjev`; put the synced project venv first.
          export PATH="$GITHUB_WORKSPACE/.venv/bin:$PATH"
          python -c "import cancerjev, sys; print('spec python:', sys.executable, cancerjev.__version__)"
          npx playwright test

  live:
    # Bounded opt-in live provider suites: never on push or pull_request, only
    # when an operator explicitly asks and the provider secrets exist.
    if: github.event_name == 'workflow_dispatch' && inputs.live_suites
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --locked --extra dev
      - name: Run the explicitly bounded live suites
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          CANCERJEV_DATA_DIR: ${{ runner.temp }}/cancerjev-live-data
        run: uv run --no-sync python -m pytest -m "live or live_gdc or live_jev or live_llm or live_acceptance"
