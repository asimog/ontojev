[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cancerjev"
version = "0.2.0"
description = "Open-access GDC research architecture with deterministic evidence and Jev semantic judgment"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "portalocker>=3.2,<4",
  "pydantic>=2.11,<3",
  "typesafe-sdk>=0.7.1,<0.8",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-timeout>=2.4,<3", "ruff>=0.12,<1", "mypy>=1.15,<3"]

[tool.mypy]
python_version = "3.12"
files = [
  "cancerjev/domain/measurements.py", "cancerjev/domain/scientific.py",
  "cancerjev/domain/evidence.py", "cancerjev/domain/_json.py", "cancerjev/domain/codecs.py",
  "cancerjev/domain/envelopes.py", "cancerjev/domain/hypotheses.py",
  "cancerjev/domain/actions.py", "cancerjev/domain/discovery.py",
  "cancerjev/domain/shards.py", "cancerjev/domain/capability.py",
  "cancerjev/domain/maturity.py", "cancerjev/domain/pathway.py",
  "cancerjev/domain/runs.py",
  "cancerjev/gdc/endpoints.py", "cancerjev/gdc/parsers.py",
  "cancerjev/research/specs.py", "cancerjev/research/acquisition.py",
  "cancerjev/research/discovery.py", "cancerjev/research/expression_discovery.py",
  "cancerjev/research/cnv_discovery.py", "cancerjev/research/cutover.py",
  "cancerjev/research/shards.py", "cancerjev/research/capability.py",
  "cancerjev/research/campaign.py", "cancerjev/research/file_admission.py",
  "cancerjev/research/live.py", "cancerjev/research/nextmove.py",
  "cancerjev/research/pathways.py", "cancerjev/research/replication.py",
  "cancerjev/research/prospective.py",
  "cancerjev/research/seams.py", "cancerjev/research/ranking.py",
  "cancerjev/research/deep.py",
  "cancerjev/research/hypotheses.py", "cancerjev/research/dossier.py",
  "cancerjev/research/investigation.py", "cancerjev/research/fixtures.py",
  "cancerjev/research/orchestrator.py",
  "cancerjev/science/errors.py", "cancerjev/science/mutation.py",
  "cancerjev/science/expression.py", "cancerjev/science/descriptors.py", "cancerjev/science/methods.py",
  "cancerjev/science/actions.py",
  "cancerjev/jev/contracts.py", "cancerjev/jev/projection.py",
  "cancerjev/jev/posture.py",
  "cancerjev/storage/readers.py",
  "apps/api/serializers.py",
]
strict = true
follow_imports = "silent"
cache_dir = ".venv/mypy-cache"

[tool.hatch.build.targets.wheel]
packages = ["cancerjev", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not live and not live_gdc and not live_jev and not live_llm and not live_acceptance"'
markers = [
  "fast: everyday gate of focused contract/invariant tests plus one core offline replay",
  "live: opt-in live provider tests (disabled by default)",
  "live_gdc: opt-in bounded live GDC contract probe",
  "live_jev: opt-in live TypeSafe/Jev evaluation",
  "live_llm: opt-in single OpenRouter call and bounded Jev critique over retained GDC evidence",
  "live_acceptance: opt-in bounded GDC/Jev run and separate LLM/Jev integration check",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
