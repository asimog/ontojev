[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cancerjev"
version = "0.1.0"
description = "Offline Phase 1 CancerJEV execution architecture"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "portalocker>=3.2,<4",
  "pydantic>=2.11,<3",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-timeout>=2.4,<3", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["cancerjev", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
