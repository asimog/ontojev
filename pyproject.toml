[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cancerjev"
version = "0.2.0"
description = "Open-access GDC research architecture with deterministic evidence and Jev semantic judgment"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "portalocker>=3.2,<4",
  "pydantic>=2.11,<3",
  "typesafe-sdk>=0.7.1,<0.8",
  "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8.4,<9", "pytest-timeout>=2.4,<3", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["cancerjev", "apps"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = '-q -m "not live and not live_gdc and not live_jev"'
markers = [
  "live: opt-in live provider tests (disabled by default)",
  "live_gdc: opt-in bounded live GDC contract probe",
  "live_jev: opt-in live TypeSafe/Jev evaluation",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
